    <path d="M-22 17h44a12 12 0 0 0 2-23.8A19 19 0 0 0-12-3 11 11 0 0 0-22 17z" fill="#0891B2"/><path d="m0-23 3.5 10.5H14l-8.5 6.2 3.2 10.4L0-2.4-8.7 4l3.4-10.4-8.7-6.2h10.5z" fill="#FDE047"/>
