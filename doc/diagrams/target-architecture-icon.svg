<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">SharpAgent target architecture</title>
  <desc id="desc">Management view of the React user interface, .NET Microsoft Agent Framework backend, SQLite, policy-controlled isolated coding workspace, telemetry, three model providers, and optional Azure services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748B"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7C3AED"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0891B2"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0F172A}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.zone{fill:#FFFFFF;fill-opacity:.78;stroke:#CBD5E1;stroke-width:1.3}.subzone{fill:#F8FBFF;stroke:#DBEAFE;stroke-width:1.3}.zone-title{font:700 14px Arial,sans-serif;letter-spacing:1.2px;fill:#64748B}.subzone-title{font:700 11px Arial,sans-serif;letter-spacing:1.1px;fill:#2563EB}.node{filter:url(#shadow)}.node-label{font:700 16px Arial,sans-serif;fill:#0F172A;text-anchor:middle}.node-detail{font:400 12px Arial,sans-serif;fill:#475569;text-anchor:middle}.flow{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#arrow)}.flow-purple{fill:none;stroke:#7C3AED;stroke-width:2.5;marker-end:url(#arrow-purple)}.flow-dashed{fill:none;stroke:#0891B2;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow-cyan)}.flow-label{font:600 12px Arial,sans-serif;fill:#475569;text-anchor:middle}.tag{font:700 11px Arial,sans-serif;fill:#2563EB;text-anchor:middle;letter-spacing:.7px}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="70" y="68" class="title">SharpAgent target architecture</text>
  <text x="70" y="98" class="subtitle">A controlled, provider-flexible coding-agent platform — recommended for a phased internal launch</text>

  <rect x="55" y="145" width="600" height="730" rx="22" class="zone"/>
  <text x="85" y="180" class="zone-title">EXPERIENCE &amp; APPLICATION</text>
  <rect x="690" y="145" width="510" height="730" rx="22" class="zone"/>
  <text x="720" y="180" class="zone-title">AGENT CONTROL &amp; EXECUTION</text>
  <rect x="1235" y="145" width="310" height="730" rx="22" class="zone"/>
  <text x="1265" y="180" class="zone-title">MODELS &amp; OPTIONAL CLOUD</text>
  <rect x="720" y="470" width="440" height="385" rx="20" class="subzone"/>
  <text x="745" y="496" class="subzone-title">CONTROLLED EXECUTION</text>

