<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Controlled coding task lifecycle</title>
  <desc id="desc">A six-step lifecycle shows a developer request flowing through the interface, agent planning, approval, isolated execution, validation, and streamed result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748B"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0F172A}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.step{font:700 13px Arial,sans-serif;fill:#2563EB;letter-spacing:1px;text-anchor:middle}.label{font:700 17px Arial,sans-serif;fill:#0F172A;text-anchor:middle}.detail{font:400 13px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#7C3AED;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}.callout{font:600 13px Arial,sans-serif;fill:#166534;text-anchor:middle}.node{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/>
  <text x="70" y="68" class="title">Controlled coding task lifecycle</text>
  <text x="70" y="98" class="subtitle">The product is designed to keep a human in control of material actions while the agent performs repetitive work.</text>
  <path d="M222 330H342M482 330H602M742 330H862M1002 330H1122M1262 330H1382" class="arrow"/>
  <path d="M1195 435C1195 535 672 555 672 440" class="loop"/>
  <text x="930" y="540" class="detail">Repeat only while there is a clear next action and the configured limits permit it</text>
  <rect x="763" y="177" width="218" height="42" rx="21" fill="#DCFCE7"/>
  <text x="872" y="204" class="callout">Approval only when policy requires it</text>

  <g class="node" transform="translate(152 330)">
    <circle r="66" fill="#E8F0FF"/><circle r="60" fill="none" stroke="#2563EB" stroke-opacity=".28"/>
    <circle cy="-17" r="15" fill="#2563EB"/><path d="M-27 33c4-19 15-28 27-28s23 9 27 28" fill="#2563EB"/>
    <text y="-98" class="step">01 · REQUEST</text><text y="101" class="label">Developer asks</text><text y="122" class="detail">a goal in plain language</text>
  </g>
  <g class="node" transform="translate(412 330)">
    <circle r="66" fill="#E8F0FF"/><circle r="60" fill="none" stroke="#2563EB" stroke-opacity=".28"/>
    <rect x="-36" y="-30" width="72" height="50" rx="7" fill="#2563EB"/><path d="M-36-16h72" stroke="#fff" stroke-width="2.8"/><circle cx="-26" cy="-23" r="2.5" fill="#fff"/><circle cx="-18" cy="-23" r="2.5" fill="#fff"/><path d="M-17-2h34M-17 9h22" stroke="#fff" stroke-linecap="round" stroke-width="3"/>
    <text y="-98" class="step">02 · CONTEXT</text><text y="101" class="label">UI starts session</text><text y="122" class="detail">and streams progress</text>
  </g>
  <g class="node" transform="translate(672 330)">
    <circle r="72" fill="#EDE9FE"/><circle r="65" fill="none" stroke="#7C3AED" stroke-opacity=".32"/>
    <path d="M-25 3a25 25 0 1 1 50 0v15A16 16 0 0 1 9 34H-9a16 16 0 0 1-16-16z" fill="#7C3AED"/><path d="M-16-20v-9M16-20v-9M0 34v9" stroke="#7C3AED" stroke-linecap="round" stroke-width="4"/><circle cx="-16" cy="-29" r="4.5" fill="#A78BFA"/><circle cx="16" cy="-29" r="4.5" fill="#A78BFA"/><circle cy="43" r="4.5" fill="#A78BFA"/><circle cx="-10" cy="6" r="3.5" fill="#fff"/><circle cx="10" cy="6" r="3.5" fill="#fff"/>
    <text y="-104" class="step">03 · PLAN</text><text y="111" class="label">MAF Harness decides</text><text y="132" class="detail">the safest next action</text>
  </g>
  <g class="node" transform="translate(932 330)">
    <circle r="66" fill="#F0FDF4"/><circle r="60" fill="none" stroke="#16A34A" stroke-opacity=".3"/>
    <path d="M0-37 30-25v18c0 20-12 31-30 37C-18 24-30 13-30-7v-18z" fill="#16A34A"/><path d="m-13-2 8 8L15-13" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"/>
    <text y="-98" class="step">04 · CONTROL</text><text y="101" class="label">Policy checks</text><text y="122" class="detail">allow, ask, or deny</text>
  </g>
  <g class="node" transform="translate(1192 330)">
    <circle r="66" fill="#FFF7ED"/><circle r="60" fill="none" stroke="#EA580C" stroke-opacity=".3"/>
    <path d="M-34-5h33l7 9h28v34h-68z" fill="#EA580C"/><path d="M-34-5v-12h31l6 12" fill="#FB923C"/><path d="m-16 12-7 8 7 8M0 28l7-17M17 12l7 8-7 8" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"/>
    <text y="-98" class="step">05 · EXECUTE</text><text y="101" class="label">Workspace acts</text><text y="122" class="detail">read · patch · build · test</text>
  </g>
  <g class="node" transform="translate(1452 330)">
    <circle r="66" fill="#ECFEFF"/><circle r="60" fill="none" stroke="#0891B2" stroke-opacity=".3"/>
    <path d="M-28 23V-26M-28 23h52" fill="none" stroke="#0891B2" stroke-linecap="round" stroke-width="3.4"/><path d="m-21 14 12-13 10 9 16-22" fill="none" stroke="#0891B2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4"/><circle cx="-21" cy="14" r="3.5" fill="#22D3EE"/><circle cx="-9" cy="1" r="3.5" fill="#22D3EE"/><circle cx="1" cy="10" r="3.5" fill="#22D3EE"/><circle cx="17" cy="-12" r="3.5" fill="#22D3EE"/>
    <text y="-98" class="step">06 · REVIEW</text><text y="101" class="label">Result returns</text><text y="122" class="detail">diff · tests · rationale</text>
  </g>
</svg>
